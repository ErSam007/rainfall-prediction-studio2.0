services:
  - type: web
    name: rainfall-prediction-studio
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: rainfall_prediction_db

